# Grafana with Loki, Prometheus and Jaeger datasources pre-provisioned.
# Jaeger is the default here (unlike ../k8s_resources) because the Go app only produces traces.
# Uses the image's default login (admin/admin, change prompted on first login);
# anonymous admin access from the docker-compose setup is intentionally not enabled here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: otel-tutorial
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: otel-tutorial
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: otel-tutorial
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
